---
# cPanel "Git Version Control" deployment config for this branch (staging).
# Runs server-side after "Update from Remote" + "Deploy HEAD Commit" in
# cPanel, or after a manual "Pull or Deploy". See scripts/cpanel-deploy-staging.sh
# for what actually happens; this file only wires the deploy path.
#
# NOTE: this file is staging-only. If this branch is ever merged into
# main, main needs its own .cpanel.yml (different deploy path, no
# noindex/GA stripping) before setting up a production cPanel repo —
# don't reuse this one as-is.
deployment:
  tasks:
    - export DEPLOYPATH=/home/foma0863/staging.bimpact.eu/
    - /bin/bash scripts/cpanel-deploy-staging.sh $DEPLOYPATH
